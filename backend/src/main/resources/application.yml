spring:
  application:
    name: elora-backend
  threads:
    virtual:
      enabled: true   # Java 21: threads virtuais = muitas requisições simultâneas com pouco hardware
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/elora}
    username: ${DATABASE_USER:elora}
    password: ${DATABASE_PASSWORD:elora}
    hikari:
      maximum-pool-size: ${DATABASE_POOL:20}
  flyway:
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:}

server:
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

elora:
  tenant:
    aceitar-cabecalho: false
  seguranca:
    desligada: false

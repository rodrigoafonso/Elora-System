# Ambiente local completo: banco + API + front-end.
#   docker compose -f infra/docker-compose.yml up --build
# Front-end: http://localhost:8081 · API: http://localhost:8080/swagger-ui.html
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: elora
      POSTGRES_USER: elora
      POSTGRES_PASSWORD: elora
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elora -d elora"]
      interval: 5s
      retries: 10

  backend:
    build: ../backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:postgresql://postgres:5432/elora
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }

  frontend:
    build:
      context: ../frontend
      args: { VITE_DATA_SOURCE: api }
    ports: ["8081:80"]
    depends_on: [backend]

volumes:
  pgdata:

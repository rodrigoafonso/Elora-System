server {
  listen 80;
  root /usr/share/nginx/html;

  # Arquivos com hash no nome: cache longo (CDN-friendly).
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }

  # API atrás do mesmo domínio (sem CORS).
  location /api/ { proxy_pass http://backend:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }

  # SPA: rotas do React caem no index.html.
  location / { add_header Cache-Control "no-cache"; try_files $uri /index.html; }
}

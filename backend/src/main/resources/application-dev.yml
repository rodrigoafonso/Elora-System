# Desenvolvimento local: sem login, tenant pelo cabeçalho X-Tenant-Id e dados de exemplo.
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/dev
    # Os dados de exemplo têm versão alta (V1000+); novas migrações (V5, V6...) entram mesmo assim.
    out-of-order: true
elora:
  tenant:
    aceitar-cabecalho: true
  seguranca:
    desligada: true
logging:
  level:
    br.com.elora: debug
